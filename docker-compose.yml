  node-exporter:
    image: prom/node-exporter:latest
    restart: always
    networks:
      - monitor_development
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: always
    networks:
      - monitor_development
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true

  prometheus:
    image: prom/prometheus:latest
    restart: always
    networks:
      - monitor_traefik_proxy
      - monitor_development
      - varuna_development
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - monitor_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'

  grafana:
    image: grafana/grafana:latest
    restart: always
    networks:
      - monitor_traefik_proxy
      - monitor_development
    volumes:
      - monitor_grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=changeme@121
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`monitor.slcrdss.in`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    ports:
    - "3001:3000"

  alertmanager:
    image: prom/alertmanager:latest
    restart: always
    networks:
      - monitor_development
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager-templates:/etc/alertmanager/templates:ro
      - monitor_alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"

  loki:
    image: grafana/loki:latest
    restart: always
    networks:
      - monitor_development
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - monitor_loki_data:/loki
    command:
      - '-config.file=/etc/loki/local-config.yaml'

  promtail:
    image: grafana/promtail:latest
    restart: always
    networks:
      - monitor_development
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '-config.file=/etc/promtail/config.yml'
    depends_on:
      - loki

volumes:
  monitor_prometheus_data:
  monitor_grafana_data:
  monitor_alertmanager_data:
  monitor_loki_data:

networks:
  monitor_development:
    external: false
  monitor_traefik_proxy:
    external: false
  varuna_development:
    name: varuna_development
    external: true
